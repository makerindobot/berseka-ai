    - "aluminum_food_cans"
    - "aluminum_soda_cans"
    - "cardboard_boxes"
    - "cardboard_packaging"
    - "clothing"
    - "disposable_plastic_cutlery"
    - "glass_beverage_bottles"
    - "glass_cosmetic_containers"
    - "glass_food_jars"
    - "magazines"
    - "newspaper"
    - "office_paper"
    - "paper_cups"
    - "plastic_cup_lids"
    - "plastic_detergent_bottles"
    - "plastic_food_containers"
    - "plastic_shopping_bags"
    - "plastic_soda_bottles"
    - "plastic_straws"
    - "plastic_trash_bags"
    - "plastic_water_bottles"
    - "shoes"
    - "steel_food_cans"
    - "styrofoam_cups"
    - "styrofoam_food_containers"

# ============================================================
# 5) Waste Segregation Image Dataset (aashidutt3) — mapping 1:1
# ============================================================
waste_segregation_aashidutt3:
  organic:
    - "Biodegradable"
  non_organic:
    - "Non-Biodegradable"
    - "Non Biodegradable"   # varian penamaan folder, verifikasi saat akuisisi

# ============================================================
# Sumber dataset & peran dalam pipeline (untuk dokumentasi/traceability)
# ============================================================
dataset_sources:
  taco_yolo:
    kaggle_ref: "vencerlanz09/taco-dataset-yolo-format"
    role: "detector_bbox_base"
    has_bbox: true
    license: "CC BY 4.0"
  taco_coco:
    kaggle_ref: "kneroma/tacotrashdataset"
    role: "detector_verification_only"
    has_bbox: true
    license: "CC BY 4.0"
  garbage_classification_v2:
    kaggle_ref: "sumn2u/garbage-classification-v2"
    role: "classifier_and_synthetic_bbox_crop_source"
    has_bbox: false
    license: "unverified_at_acquisition"
  alistairking_recyclable_household:
    kaggle_ref: "alistairking/recyclable-and-household-waste-classification"
    role: "classifier_and_domain_augmentation"
    has_bbox: false
    license: "non_commercial_research"
  waste_segregation_aashidutt3:
    kaggle_ref: "aashidutt3/waste-segregation-image-dataset"
    role: "classifier_binary_direct"
    has_bbox: false
    license: "unverified_at_acquisition"
  realwaste:
    kaggle_ref: "joebeachcapital/realwaste"
    role: "classifier_domain_realism_highest"
    has_bbox: false
    license: "CC BY-NC-SA 4.0 (strictest clause applied)"
