# BERSEKA AI — Konfigurasi Terpusat Mapping Label
# Single source of truth untuk seluruh mapping kelas granular -> skema biner
# ORGANIC / NON_ORGANIC. JANGAN hardcode mapping ini di kode training/preprocessing —
# selalu load dari file ini agar auditable & mudah direvisi bila definisi klien berubah.
#
# Acuan: docs/dataset/dataset-decision.md §3 (Skema Mapping Label)
# Status: Final — Backlog 1, siap dieksekusi di Backlog 2.
# Setiap perubahan mapping WAJIB disinkronkan balik ke dataset-decision.md §3.

version: 1
target_classes:
  - ORGANIC
  - NON_ORGANIC

# kelas yang dibuang sepenuhnya dari training set (ambigu, tidak bisa dipetakan aman)
dropped_classes:
  - "Unlabeled litter"
  - "Other litter"

# ============================================================
# 1) TACO (60 kelas granular) -> ORGANIC / NON_ORGANIC
#    Dipakai untuk dataset detector (bbox): vencerlanz09/taco-dataset-yolo-format
#    diverifikasi silang dengan kneroma/tacotrashdataset (COCO asli).
# ============================================================
taco:
  organic:
    - "Food waste"
    - "Garden waste"
  non_organic:
    # plastik
    - "Clear plastic bottle"
    - "Other plastic bottle"
    - "Plastic bottle cap"
    - "Plastic lid"
    - "Plastic film"
    - "Plastic straw"
    - "Plastic utensils"
    - "Disposable plastic cup"
    - "Styrofoam piece"
    - "Other plastic"
    - "Other plastic wrapper"
    - "Single-use carrier bag"
    - "Six pack rings"
    - "Plastic glooves"
    - "Plastic gloves"
    - "Squeezable tube"
    - "Tupperware"
    - "Polypropylene bag"
    - "Crisp packet"
    - "Spread tub"
    - "Foam food container"
    - "Foam cup"
    # logam
    - "Drink can"
    - "Metal bottle cap"
    - "Aluminium foil"
    - "Scrap metal"
    - "Pop tab"
    - "Metal lid"
    - "Food can"
    - "Aerosol"
    # kaca
    - "Glass bottle"
    - "Glass jar"
    - "Glass cup"
    - "Broken glass"
    # kertas & kardus (operasional non-organik, lihat §3.3 dataset-decision.md)
    - "Normal paper"
    - "Paper cup"
    - "Paper bag"
    - "Tissues"
    - "Magazine paper"
    - "Wrapping paper"
    - "Corrugated carton"
    - "Other carton"
    - "Egg carton"
    - "Drink carton"
    - "Meal carton"
    - "Pizza box"
    - "Toilet tube"
    # rokok (filter mengandung plastik)
    - "Cigarette"
    - "Cigarette butt"
    # lain-lain non-organik
    - "Rope & strings"
    - "Rope - strings"
    - "Shoe"
    - "Battery"
    - "Unlabeled litter"      # akan didrop, lihat dropped_classes
    - "Other litter"          # akan didrop, lihat dropped_classes
  # flag tambahan untuk metadata internal, TIDAK mengubah label biner v1
  hazard_flags:
    - "Battery"

# ============================================================
# 2) RealWaste (joebeachcapital/realwaste) — 9 kelas
# ============================================================
realwaste:
  organic:
    - "Food Organics"
    - "Vegetation"
  non_organic:
    - "Cardboard"
    - "Glass"
    - "Metal"
    - "Paper"
    - "Plastic"
    - "Textile Trash"
    - "Miscellaneous Trash"   # default aman: non-organik (lihat §3, judgment call)

# ============================================================
# 3) Garbage Classification v2 (sumn2u/garbage-classification-v2) — 10 kelas
# ============================================================
garbage_classification_v2:
  organic:
    - "biological"
  non_organic:
    - "metal"
    - "glass"
    - "paper"
    - "battery"
    - "trash"
    - "cardboard"
    - "shoes"
    - "clothes"
    - "plastic"

# ============================================================
# 4) Recyclable & Household Waste Classification (alistairking) — 30 kelas
#    Nama kelas asli mengikuti struktur folder dataset; verifikasi taksonomi
#    persis saat akuisisi (Backlog 2) karena README publik tidak selalu 1:1
#    dengan nama folder. Daftar di bawah mencakup nama folder umum dataset ini.
# ============================================================
alistairking_recyclable_household:
  organic:
    - "food_waste"
    - "coffee_grounds"
    - "eggshells"
    - "tea_bags"
  non_organic:
