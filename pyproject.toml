[project]
name = "berseka-ai-training"
version = "0.1.0"
description = "BERSEKA AI - YOLOv8 training pipeline (Kaggle GPU cloud)"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.2.0",
    "kaggle>=1.6.17",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]
